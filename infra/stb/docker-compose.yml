services:
  core:
    build: ../../services/core
    restart: unless-stopped
    env_file: .env          # secrets, never committed
    volumes:
      - core-data:/data     # SQLite survives restarts
    mem_limit: 256m
    cpus: 0.5

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on: [core]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Local check only; public traffic arrives through the tunnel. 8080 is taken by KatalogKu on the STB.
    ports: ["127.0.0.1:8081:80"]
    mem_limit: 64m
    cpus: 0.25

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [gateway]
    mem_limit: 64m
    cpus: 0.25

  # The class route sends the rest of the hostname to https://localhost:1122 (aaPanel). Inside the
  # tunnel container localhost is the container, so this relay shares its network and forwards to the host.
  panel-relay:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    network_mode: "service:tunnel"
    command: TCP-LISTEN:1122,fork,reuseaddr TCP:host.docker.internal:1122
    depends_on: [tunnel]
    mem_limit: 16m
    cpus: 0.1

volumes:
  core-data:

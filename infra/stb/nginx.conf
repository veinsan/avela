limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# The API answers JSON only, so it gets the strictest policy. Swagger UI at /api/docs loads its script and style
# from jsDelivr and starts with an inline script, so that page alone gets a wider one.
map $uri $avela_csp {
    ~^/api/docs  "default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://cdn.jsdelivr.net; img-src data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none'";
    default      "default-src 'none'; frame-ancestors 'none'";
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 64k;

    # Inherited by every location below because none of them sets its own add_header.
    add_header Content-Security-Policy $avela_csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Only the tunnel container reaches this gateway, so trust Cloudflare's client IP header.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    limit_req_status 429;
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests.","requestId":"$request_id","retryable":true}}';
    }

    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://core:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }

    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://core:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }
}
